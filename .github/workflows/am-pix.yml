name: am-pix
# Видео и фото Pixabay для роликов @aleksandr_markets (scripts/am_pix.py). Файлы в артефакте на 3 дня.
on:
  push:
    paths: ["am/research/pix/request.txt"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/am_pix.py
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: pix, path: pix_out, retention-days: 3 }
      - run: |
          git config user.name "osnova-bot"; git config user.email "osnova-bot@users.noreply.github.com"
          git add am/research/pix/manifest.json; git commit -m "am: pix manifest [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
