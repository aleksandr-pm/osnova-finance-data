name: am-research
# Разовые выгрузки данных для роликов @aleksandr_markets (scripts/am_research.py)
on:
  push:
    paths: ["am/research/request.txt"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance requests pypdf
      - run: python scripts/am_research.py
      - run: |
          git config user.name "osnova-bot"; git config user.email "osnova-bot@users.noreply.github.com"
          git add am/research; git commit -m "am: research [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
