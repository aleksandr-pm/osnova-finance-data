name: property-stats
# @osnova.property: статистика публикаций раз в день (23:53 по Дубаю) -> property/stats.json и property/stats_report.md
on:
  schedule:
    - cron: "53 19 * * *"
  push:
    branches: [main]
    paths: ["property/stats_request.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: property-state
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Stats
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_PROP || secrets.IG_TOKEN }}
          IG_USER_ID_PROP: ${{ secrets.IG_USER_ID_PROP }}
        run: python property/stats.py || true
      - name: Save
        run: |
          git config user.name "osnova-bot"
          git config user.email "osnova-bot@users.noreply.github.com"
          git add -A property/stats.json property/stats_report.md 2>/dev/null || true
          git commit -m "property: stats [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
