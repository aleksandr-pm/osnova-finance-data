name: reels

# Reels в Instagram, 2 в день (с 12.11, было 3). Время в cron по UTC, Дубай = UTC+4.
# С 14.11 каждый опубликованный ролик дублируется в Telegram @osnovafin полной таблицей (#рейтинг).
on:
  schedule:
    # 12:47 по Дубаю
    - cron: "47 8 * * *"
    # 20:17 по Дубаю
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = только собрать ролик, без публикации"
        required: true
        default: "yes"
      id:
        description: "id рейтинга (пусто = следующий по очереди)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-state
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow babel

      - run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Render and publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          mkdir -p bank/logs
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "yes" ]; then ARGS="--dry-run"; fi
          if [ -n "${{ inputs.id }}" ]; then ARGS="$ARGS --id ${{ inputs.id }}"; fi
          set +e
          python scripts/reel.py $ARGS 2>&1 | tee bank/logs/last_reels.txt
          CODE=${PIPESTATUS[0]}
          echo "exit=$CODE $(date -u +%FT%TZ)" >> bank/logs/last_reels.txt
          echo "$CODE" > /tmp/reel_exit

      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reel.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state
        run: |
          git config user.name "osnova-bot"
          git config user.email "osnova-bot@users.noreply.github.com"
          git add bank/state_reels.json bank/logs assets/logos 2>/dev/null
          git commit -m "reels: publish [skip ci]" || echo "nothing to commit"
          # 14.11: опубликованный ролик дублируется в Telegram (tg/outbox_report.json), запись переносится после pull
          for i in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort; sleep 5; continue; }
            if [ -f tg_pending_reel.json ]; then
              python scripts/reel.py --tg-flush
              git add tg/outbox_report.json
              git commit -m "reels: пост в Telegram [skip ci]" || true
            fi
            git push && break
            sleep 5
          done

      - name: Result
        run: exit $(cat /tmp/reel_exit)
