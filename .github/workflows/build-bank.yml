name: build-bank

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/build-bank.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"   # 1-го числа каждого месяца, 07:17 по Дубаю

permissions:
  contents: write

concurrency:
  group: build-bank
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas requests pillow babel pycountry

      - name: Emoji font
        run: sudo apt-get install -y fonts-noto-color-emoji

      - name: Build
        run: |
          rm -rf bank/cards
          mkdir -p bank
          set +e
          python scripts/build_bank.py 2>&1 | tee bank/build_log.txt
          echo "exit=${PIPESTATUS[0]} $(date -u +%FT%TZ)" >> bank/build_log.txt

      - name: Commit
        run: |
          git config user.name "osnova-bot"
          git config user.email "osnova-bot@users.noreply.github.com"
          git add bank
          git commit -m "bank: update [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
