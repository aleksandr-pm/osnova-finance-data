name: property-reels
# @osnova.property (EN): 2 Reels + 1 пост в день из очереди property/queue.json. Материалы собираются заранее, здесь только публикация.
# Публикация только при наличии property/LIVE. Пауза: дата в property/pause_until.txt.
on:
  schedule:
    # 4 Reels в день (по Дубаю 09:11, 13:11, 17:41, 21:11) и 1 пост (15:41). Лучшие слоты выберем по статистике.
    - cron: "11 5 * * *"
    - cron: "11 9 * * *"
    - cron: "41 13 * * *"
    - cron: "11 17 * * *"
    - cron: "41 11 * * *"   # пост
  push:
    branches: [main]
    paths: ["property/publish_request.txt"]   # разовая публикация вне расписания
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = только показать следующий ролик и подпись"
        required: true
        default: "yes"
      slot:
        description: "reel или post"
        required: true
        default: "reel"
permissions:
  contents: write
concurrency:
  group: property-state
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_PROP || secrets.IG_TOKEN }}
          IG_USER_ID_PROP: ${{ secrets.IG_USER_ID_PROP }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "yes" ]; then ARGS="--dry-run"; fi
          SLOT="${{ inputs.slot }}"
          if [ "${{ github.event.schedule }}" = "41 11 * * *" ]; then SLOT=post; elif [ -n "${{ github.event.schedule }}" ]; then SLOT=reel; fi
          if [ "${{ github.event_name }}" = "push" ]; then ARGS="--force"; SLOT=$(awk '{print $1; exit}' property/publish_request.txt); fi
          export SLOT=${SLOT:-reel}
          set +e
          python property/publish.py $ARGS
          echo $? > /tmp/code
      - name: Save state
        run: |
          git config user.name "osnova-bot"
          git config user.email "osnova-bot@users.noreply.github.com"
          git add -A property/logs
          if [ -f property/state.json ]; then git add property/state.json; fi
          git commit -m "property: publish [skip ci]" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Result
        run: exit $(cat /tmp/code)
