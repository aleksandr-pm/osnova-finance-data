name: property-reels
# @osnova.property (EN): 1 Reels в день из очереди property/queue.json. Ролики собираются заранее, здесь только публикация.
# Публикация только при наличии property/LIVE. Пауза: дата в property/pause_until.txt.
on:
  schedule:
    - cron: "41 14 * * *"   # 18:41 по Дубаю
  push:
    branches: [main]
    paths: ["property/publish_request.txt"]   # разовая публикация вне расписания
  workflow_dispatch:
    inputs:
      dry_run:
        description: "yes = только показать следующий ролик и подпись"
        required: true
        default: "yes"
permissions:
  contents: write
concurrency:
  group: property-state
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN_PROP || secrets.IG_TOKEN }}
          IG_USER_ID_PROP: ${{ secrets.IG_USER_ID_PROP }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "yes" ]; then ARGS="--dry-run"; fi
          if [ "${{ github.event_name }}" = "push" ]; then ARGS="--force"; fi
          set +e
          python property/publish.py $ARGS
          echo $? > /tmp/code
      - name: Save state
        run: |
          git config user.name "osnova-bot"
          git config user.email "osnova-bot@users.noreply.github.com"
          git add property/state.json property/logs 2>/dev/null
          git commit -m "property: publish [skip ci]" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Result
        run: exit $(cat /tmp/code)
