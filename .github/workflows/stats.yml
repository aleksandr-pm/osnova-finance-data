name: stats
on:
  workflow_dispatch:
  schedule:
    - cron: "11 5 * * 1"
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/stats.py
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_TOKEN_REPORT: ${{ secrets.THREADS_TOKEN_REPORT }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - run: |
          git config user.name "osnova-bot"; git config user.email "bot@users.noreply.github.com"
          git add bank/logs/stats.txt && git commit -m "stats [skip ci]" && git pull --rebase && git push || true
